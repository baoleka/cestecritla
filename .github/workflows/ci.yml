# Continuous integration — on every pull request and push to main (D6.5, D12.3): every gate of
# CLAUDE.md that needs neither private/ nor a quiet machine, in Chromium. What stays on the
# editor's machine: the three engines, the measures of frames and flashes (`npm run e2e:game`
# without `--no-lab`, `npm run e2e:mascot2:motion`), and the content half of the leak gate.
#
# Until now .github/workflows/ held only recrawl.yml: nothing checked a pull request, and none
# of the conformity gates the dossier describes existed anywhere but on paper.
#
# Everything here runs at ZERO neurons (D6.7: AI_MODE stays off; the corpus, the evaluation set
# and the fixtures are all in the repo). What leaves the runner: `npm ci`, the browsers and
# system packages Playwright installs, and wrangler's look for a newer version of itself. The
# usage reports of wrangler and Astro are turned off for every step below (review 13, G12).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# No usage report from the tools (scripts/quiet-env.ts says the same for the commands our
# scripts start). wrangler refuses « 0 »: its word is « false ».
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Env is generated, never hand-written (09-architecture.md §2). Not versioned: 591 KB.
      # wrangler runs each configuration's « build » step even here: the guard that stops a
      # deploy scripts/deploy.ts did not start (scripts/deploy-guard.mjs). This command sends
      # nothing, and says so.
      - name: Generate Worker types
        run: npx wrangler types
        env:
          CEL_DEPLOY_FROM: nothing-is-sent

      # Gate 1 of CLAUDE.md, unchanged: scripts/ and eval/ under the root tsconfig. Then the
      # Worker (workers-types, Bundler resolution) and the app (.astro), which cannot share one
      # set of compiler options with the Node scripts.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The build must come before the tests: the "no AI mention" gate reads dist/, because what
      # matters is which strings actually ship, not which ones exist in the kit.
      - name: Build
        run: npm run build

      # Gate 2 of CLAUDE.md. One glob, scripts/*.test.ts, covers every test file — do not split
      # it into several arguments.
      - name: Tests
        run: npm test

      # The build of production goes through scripts/deploy.ts to production, as a dry run: it sends
      # nothing, so the guards that hold production back (homeBlockers, wordsBlockers) do not speak —
      # but what dist/ holds must be what this host would serve. Since the preview host shows the
      # explained words first (PLAN-MOTS, lot 16), a build of production is no longer a build of
      # the preview host: that one is made and sent below.
      - name: Deploy dry run (app → apex)
        run: npx tsx scripts/deploy.ts apex --dry-run --outdir /tmp/wdry-app

      # Gate 3: the 28 role pairs actually rendered, 4.5:1 for text and 3:1 for a rule, border or
      # focus ring, non-zero exit on failure.
      - name: Contrast
        run: npm run contrast

      # wrangler measures the startup and never judges it (review 13, G7): the budget is read off
      # the profile it writes, well under Cloudflare's limit of one second.
      - name: Worker startup budget
        run: npx wrangler check startup && npx tsx scripts/startup-budget.ts worker-startup.cpuprofile
        env:
          CEL_DEPLOY_FROM: nothing-is-sent

      # A `wrangler deploy` typed by hand must stop before it bundles anything, in every
      # configuration: the file a bare command reads (wrangler.jsonc), production's files
      # (wrangler.static.jsonc) and the chat's Worker (wrangler.chat.jsonc). A dry run is enough
      # to see it, and it has to be the guard that speaks (14-risques.md R41).
      - name: A bare wrangler deploy is refused
        run: |
          for config in "" "--config wrangler.static.jsonc" "--config wrangler.chat.jsonc"; do
            for env in "" preview; do
              if npx wrangler deploy --dry-run $config --env="$env" --outdir /tmp/wbare > /tmp/wbare.log 2>&1; then
                echo "a bare deploy went through: ${config:-wrangler.jsonc} --env=$env"; exit 1
              fi
              grep -q "deploy refused: wrangler was not started by scripts/deploy.ts" /tmp/wbare.log
            done
          done

      # « Demander » reaches the apex as a Worker of its own, on two exact addresses in front
      # of the static files (wrangler.chat.jsonc, PLAN-CHAT lot C10). It is bundled here in both
      # environments, through the script that alone may deploy it: a dry run sends nothing and
      # needs no accord.
      - name: Deploy dry run (Worker of the chat → preview host)
        run: npx tsx scripts/deploy.ts preview --chat --dry-run --outdir /tmp/wdry-chat-preview

      - name: Deploy dry run (Worker of the chat → apex)
        run: npx tsx scripts/deploy.ts apex --chat --dry-run --outdir /tmp/wdry-chat

      # The preview host may be ahead of production — it asked questions first (and, from 15 to
      # 16 November 2026, showed the second generation of the mascot first). So its build is
      # made here too, judged by the same dist-bound gates, and sent as a dry run through the
      # one script that deploys: a build made for the preview host must be accepted there.
      - name: Build (preview host)
        run: npm run build:preview

      - name: Tests (on the build of the preview host)
        run: npm test

      - name: Deploy dry run (the build of the preview host → preview host)
        run: npx tsx scripts/deploy.ts preview --dry-run --outdir /tmp/wdry-preview

      # The Worker of « Demander » (D16.7) is bundled on every pull request, whether or not the
      # site answers questions yet: its bindings are the AI, the private base, the allowance and
      # the rate limiter, and nothing else (scripts/build-mode.test.ts holds the list) — through
      # scripts/deploy.ts, as the bench deploys it: the rule that keeps the Worker off the apex
      # and waits for the base must accept a dry run. It carries the build of the preview host,
      # the only host it goes to.
      - name: Deploy dry run (bench → preview host)
        run: npx tsx scripts/deploy.ts preview --bench --dry-run --outdir /tmp/wdry-bench

      # The holding site (D15.4) served the apex until the launch (14/11/2026, D16.36); it is the
      # withdrawal now (D14.10, sheet 9 of 14-risques.md §4). It is a second build of the same tree, so it goes
      # through the same dist-bound gates — and through scripts/deploy.ts, the only caller of
      # wrangler, which must accept it for the apex and pick the static-only configuration.
      - name: Build (holding)
        run: npm run build:holding

      - name: Tests (on the holding build)
        run: npm test

      - name: Deploy dry run (holding → apex)
        run: npx tsx scripts/deploy.ts apex --dry-run --outdir /tmp/wdry-holding

      - name: Deploy dry run (holding → preview host)
        run: npx tsx scripts/deploy.ts preview --dry-run --outdir /tmp/wdry-holding-preview

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # A1/A2/A3, replayed on EVERY pull request and not only at the September milestone —
      # the gap the red panel found. Zero serious/critical axe violation and no horizontal
      # scroll, across 390 px, reflow 320 px, dark, system font at 130 % and 150 %, and
      # reduced motion.
      - name: Accessibility and reflow
        run: npm run a11y

      # The search island, hostile input, links into the book, bridges, and the page's own
      # Content-Security-Policy — on the built app, with every other host intercepted.
      - name: End to end
        run: npx tsx scripts/e2e.ts --engines chromium

      # « Demander », before any bench allows it to ship: a test build of the app as it would be
      # if the site answered questions, against a Worker that is simulated. No model runs, no
      # neuron is spent. Typing sends nothing; the gesture sends once, to /api/gists, the state
      # of the book and measure ids — never the question (D16.53); every answer of the Worker,
      # right or wrong, becomes a page.
      - name: End to end of the ask screen (test build, simulated Worker)
        run: npm run build:ask && npx tsx scripts/e2e-ask.ts --engines chromium

      # The sheet as it opens (D16.59, D16.60): sentences written ahead, no live AI. Its own
      # test build (dist-gists/), which the notices gate below reads too.
      - name: End to end of the sheet without a live AI (test build, simulated Worker)
        run: npm run build:gists && npx tsx scripts/e2e-sheet.ts --engines chromium

      # The explained words outside the sheet (PLAN-MOTS, D20.11, D20.13), on the test build of
      # the sheet (dist-gists/): a folded line that fetches nothing until it is opened, then one
      # file, under its label.
      - name: End to end of the explained words (test build)
        run: npx tsx scripts/e2e-words.ts --engines chromium

      # « Où est-ce écrit ? », on the ask test build (dist-ask/, built above): without script,
      # then with it — a choice is
      # never wrong, a round sends nothing and writes nothing, and the mascot (D17.1 to D17.36)
      # changes at the end of a round only: her four passages beat by beat, « Passer », less
      # motion, her sheet, her colour, what is written and where. A shared runner is not a quiet
      # machine: her frames and her flashes are measured on the editor's (`--no-lab`;
      # `npm run e2e:game`, three engines).
      - name: End to end of the game (test build)
        run: npx tsx scripts/e2e-game.ts --engines chromium --no-lab

      # Gates of CLAUDE.md that need neither private/ nor a quiet machine, and that CI never ran
      # (review 13, G13): the 48 cards and 16 round ends at five phone sizes (no tile over five
      # lines, « Mot suivant » whole at 390 × 844), her figures as the sheet counts them, and the
      # reading desk on an invented book.
      - name: Sweep of the game's cards (test build)
        run: npx tsx scripts/sweep-game.ts

      - name: Her figures, state by state
        run: npx tsx scripts/mascot2-render.ts --engines chromium

      - name: End to end of the reading desk (invented book)
        run: npx tsx scripts/e2e-gists.ts --engines chromium

      # The gates that judge the notices, the security policy, the words of the game — and the
      # rule of the deploy that refuses a test build that asks (review 13, G8) — read dist-ask/
      # when it is there: replayed now that it is, so that the half of each that needs the
      # screen to exist is exercised too — her place in the game block among them.
      - name: Notices, policy and words of the test build
        run: npm run build:scrutin:test && npx tsx --test scripts/check-no-ai-mention.test.ts scripts/check-build.test.ts scripts/game-page.test.ts scripts/words-page.test.ts scripts/build-mode.test.ts

      # The parser's second opinion (D15.6): the synthetic official site — 2026 markup around the
      # 2025 text — re-read by a real DOM, and a sample of deep links followed.
      - name: Browser check of the 2026 parser (synthetic site)
        run: npx tsx scripts/verify-2026.ts --synthetic --sample 60

      # The word of the game lit up in the official page (lot J4): the pass that asks a browser
      # where it goes for a word must be able to say yes, to say « matched elsewhere first »,
      # and its control must be able to fail. The real words are asked on the stored pages, on
      # the editor's machine, in three engines.
      - name: Browser check of the words' links (synthetic site)
        run: npx tsx scripts/verify-2026.ts --synthetic --words

      - name: Accessibility and reflow (holding build)
        run: npm run build:holding && npm run a11y
