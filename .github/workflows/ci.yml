# Continuous integration — every gate, on every pull request (D6.5, D12.3).
#
# Until now .github/workflows/ held only recrawl.yml: nothing checked a pull request, and none
# of the conformity gates the dossier describes existed anywhere but on paper.
#
# Everything here runs at ZERO neurons and makes no outbound network call beyond `npm ci`
# (D6.7: AI_MODE stays off; the corpus, the evaluation set and the fixtures are all in the repo).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Env is generated, never hand-written (09-architecture.md §2). Not versioned: 591 KB.
      - name: Generate Worker types
        run: npx wrangler types

      # Gate 1 of CLAUDE.md, unchanged: scripts/ and eval/ under the root tsconfig. Then the
      # Worker (workers-types, Bundler resolution) and the app (.astro), which cannot share one
      # set of compiler options with the Node scripts.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The build must come before the tests: the "no AI mention" gate reads dist/, because what
      # matters is which strings actually ship, not which ones exist in the kit.
      - name: Build
        run: npm run build

      # Gate 2 of CLAUDE.md. One command covers every test file, check-strings.test.ts included
      # since it was renamed into the glob at 5c6ee51 — do not split it back into two arguments.
      - name: Tests
        run: npm test

      # The app is static files in v1 (D15.14): it goes through scripts/deploy.ts like the holding
      # site, to the preview host only — the apex refuses it until launch day (D15.5).
      - name: Deploy dry run (app → preview host)
        run: npx tsx scripts/deploy.ts preview --dry-run --outdir /tmp/wdry-app

      # Gate 3: the 28 role pairs actually rendered, 4.5:1 for text and 3:1 for a rule, border or
      # focus ring, non-zero exit on failure.
      - name: Contrast
        run: npm run contrast

      - name: Worker startup budget
        run: npx wrangler check startup

      # Proves the v1/v2 scope rather than declaring it: no ai, no d1_databases, no
      # durable_objects, no ratelimits, no kv_namespaces, no crons (D6.10, D13.1).
      # `--env=""` names the top-level environment explicitly: since a second environment
      # exists, wrangler warns on any deploy that does not say which one it means.
      - name: Deploy dry run
        run: npx wrangler deploy --dry-run --env="" --outdir /tmp/wdry

      # The preview environment (D15.12) is a second Worker with its own routes, vars and
      # dataset: none of the three is inherited the way one would assume.
      - name: Deploy dry run (preview environment)
        run: npx wrangler deploy --dry-run --env preview --outdir /tmp/wdry-preview

      # The holding site (D15.4) is what the apex actually serves until launch day, and the
      # withdrawal gesture of runbook sheet 9. It is a second build of the same tree, so it goes
      # through the same dist-bound gates — and through scripts/deploy.ts, the only caller of
      # wrangler, which must accept it for the apex and pick the static-only configuration.
      - name: Build (holding)
        run: npm run build:holding

      - name: Tests (on the holding build)
        run: npm test

      - name: Deploy dry run (holding → apex)
        run: npx tsx scripts/deploy.ts apex --dry-run --outdir /tmp/wdry-holding

      - name: Deploy dry run (holding → preview host)
        run: npx tsx scripts/deploy.ts preview --dry-run --outdir /tmp/wdry-holding-preview

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # A1/A2/A3, replayed on EVERY pull request and not only at the September milestone —
      # the gap the red panel found. Zero serious/critical axe violation and no horizontal
      # scroll, across 390 px, reflow 320 px, dark, system font at 130 % and 150 %, and
      # reduced motion.
      - name: Accessibility and reflow
        run: npm run a11y

      # The search island, hostile input, links into the book, bridges, and the page's own
      # Content-Security-Policy — on the built app, with every other host intercepted.
      - name: End to end
        run: npx tsx scripts/e2e.ts --engines chromium

      # The parser's second opinion (D15.6): the synthetic official site — 2026 markup around the
      # 2025 text — re-read by a real DOM, and a sample of deep links followed.
      - name: Browser check of the 2026 parser (synthetic site)
        run: npx tsx scripts/verify-2026.ts --synthetic --sample 60

      - name: Accessibility and reflow (holding build)
        run: npm run build:holding && npm run a11y
