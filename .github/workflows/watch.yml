# Daily watch on aec2027.fr (risk R6, runbook sheet 10), and the two reminders of the site.
#
# Kept out of recrawl.yml on purpose: that workflow only opens a weekly reminder — the source is
# checked from a residential connection since D14.13 — and 14-risques.md asks for one HEAD PER
# DAY on aec2027.fr. (The dossier says "aec2027.fr hebdo" in prompt-final.md §12 and "une
# requête HEAD par jour" in 14-risques.md §4 sheet 10. Daily is the stricter of the two and costs
# three requests, so daily it is — the discrepancy is noted rather than silently resolved.)
#
# This job REPORTS. It never decides: D12.6 forbids any pivot on anything but an observed and
# archived signal, and forbids any such decision during an L49 freeze.
#
# Two jobs, so that a third-party site that never answers cannot take the reminders with it
# (review 13, G3); and in each, a last step that turns red when a probe could not do its work —
# an exit other than 0 (nothing) or 3 (something) — so that a failure is seen, never read as
# « nothing due » (G2).
name: Watch aec2027.fr

on:
  schedule:
    - cron: '30 5 * * *' # daily; GitHub starts scheduled runs hours late
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-aec2027
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: HEAD aec2027.fr and compare the six signals
        id: watch
        run: |
          set +e
          npx tsx scripts/watch-aec2027.ts --json > /tmp/watch.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/watch.json

      # Exit 3 means a signal moved. Exit 1 means unreachable — an error page included — which is
      # worth knowing but is NOT a signal: a network failure must never be read as "the site
      # changed" (the last step says it, in red).
      - name: Open an issue when a signal moves, one at a time
        if: steps.watch.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The reference is a constant: once a signal moved, every day differs from it until
          # someone writes the new values in. One open issue at a time (review 13, G1) — a
          # second one would train the reader to ignore both.
          gh label create veille --force --color FBCA04 \
            --description "Un signal de veille a changé : à archiver, pas à décider"
          open="$(gh issue list --label veille --state open --json number --jq 'length')"
          if [ "$open" != "0" ]; then
            echo "an issue of the watch is open already: nothing more"
            exit 0
          fi
          {
            echo "Un des six signaux de veille d'aec2027.fr a changé."
            echo
            echo '```json'
            cat /tmp/watch.json
            echo '```'
            echo
            echo "**Ce n'est pas une décision.** Archiver une capture datée dans"
            echo "\`docs/discovery/captures/\`, puis lire la fiche 10 du runbook"
            echo "(déclencheurs A-H, délai 0 h à 2 j)."
            echo
            echo "Avant de fermer : reporter les valeurs observées dans \`REFERENCE\`"
            echo "(\`scripts/watch-aec2027.ts\`) — sans quoi chaque jour diffère de la référence."
            echo
            echo "Règles de sang-froid (D12.6) : aucun pivot sur une rumeur, une capture ou un"
            echo "message — seulement sur un signal observé et archivé ; **aucune décision"
            echo "pendant un gel L49** (16-18 avril, 30 avril-2 mai 2027) : on note, on attend."
          } > /tmp/issue.md
          gh issue create \
            --title "Veille R6 — un signal d'aec2027.fr a changé ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/issue.md \
            --label veille

      - name: A probe that could not do its work is seen
        if: always()
        env:
          WATCH: ${{ steps.watch.outputs.code }}
        run: |
          case "$WATCH" in
            0 | 3) ;;
            *) echo "::error::the watch of aec2027.fr exited ${WATCH:-nothing}: unreachable, or it failed"; exit 1 ;;
          esac

  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The scrutin build (D16.16, runbook sheet 7) must be live before each electoral silence
      # window, and nothing on the site can deploy it: it is a gesture of the editor. This job
      # reminds, five days ahead, once per window. It is not a guard — GitHub suspends scheduled
      # workflows after sixty days without activity; the guards are in the page, in the Worker
      # and in scripts/deploy.ts.
      - name: Is an electoral silence window near?
        id: scrutin
        run: |
          set +e
          npx tsx scripts/scrutin-reminder.ts > /tmp/scrutin.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/scrutin.md

      # Once per window: a reminder whose title begins with the same key exists, open or closed.
      # Compared to the letter on the list of issues — never through GitHub's search, which
      # matches the words of a key in any order (review 13, G6).
      - name: Open the reminder, once per window
        if: steps.scrutin.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(head -n 1 /tmp/scrutin.md)"
          key="$(printf '%s' "$title" | cut -d']' -f1)]"
          tail -n +3 /tmp/scrutin.md > /tmp/scrutin-body.md
          gh label create scrutin --force --color D1271C \
            --description "Silence électoral : déployer la build scrutin"
          found="$(KEY="$key" gh issue list --state all --limit 1000 --json title --jq '[.[] | select(.title | startswith(env.KEY))] | length')"
          if [ "$found" = "0" ]; then
            gh issue create --title "$title" --body-file /tmp/scrutin-body.md --label scrutin
          fi

      # The facts the explained words state (a year, a share, a length of time) are read again
      # every ninety days (PLAN-MOTS, lot 13; R70). This job reminds, once per due day — the
      # latest one, so that a fact left unread does not hide the next (G4). It is not a guard: a
      # fact that changed stays on the site until someone rewrites it.
      - name: Are facts of the explained words due for a reading?
        id: words
        run: |
          set +e
          npx tsx scripts/terms-recall.ts > /tmp/words.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/words.md

      - name: Open the reminder, once per due day
        if: steps.words.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(head -n 1 /tmp/words.md)"
          key="$(printf '%s' "$title" | cut -d']' -f1)]"
          tail -n +3 /tmp/words.md > /tmp/words-body.md
          gh label create mots --force --color 4C0297 \
            --description "Mots expliqués : relire les sources des faits datés"
          found="$(KEY="$key" gh issue list --state all --limit 1000 --json title --jq '[.[] | select(.title | startswith(env.KEY))] | length')"
          if [ "$found" = "0" ]; then
            gh issue create --title "$title" --body-file /tmp/words-body.md --label mots
          fi

      - name: A reminder that could not be computed is seen
        if: always()
        env:
          SCRUTIN: ${{ steps.scrutin.outputs.code }}
          WORDS: ${{ steps.words.outputs.code }}
        run: |
          failed=0
          for pair in "scrutin:$SCRUTIN" "words:$WORDS"; do
            case "${pair#*:}" in
              0 | 3) ;;
              *) echo "::error::the reminder ${pair%%:*} exited ${pair#*:}: it could not be computed"; failed=1 ;;
            esac
          done
          exit "$failed"
