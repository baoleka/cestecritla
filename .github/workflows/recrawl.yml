# Weekly reminder to re-crawl "L'Avenir en commun 2025" (D1.3, amended by D14.13).
#
# This workflow USED to do the crawl. It cannot: measured 10/9/2026, on the first real execution
# the dossier ever attempted (H-COR-2), melenchon2027.fr answers HTTP 403 to GitHub Actions
# runners. Isolated precisely — from a residential connection every client gets 200 (curl with
# the project UA, with a browser UA, with NO UA at all, and Node's fetch, the exact code path
# ingest.ts uses); from the runner, 403. It is the source IP range, not the User-Agent and not
# the TLS fingerprint. The site sits behind Cloudflare.
#
# So the crawl moved to `npm run recrawl`, run locally, which keeps the same order and the same
# gates: nothing is written to data/ unless the invariants hold, and a change never lands on
# main directly — it opens a pull request that a human reads. What remains here is the one thing
# Actions can still do: remind, on a date, in a place that is not somebody's memory.
name: Rappel de re-crawl hebdomadaire

on:
  schedule:
    - cron: '0 6 * * 1' # lundi 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: recrawl-reminder
  cancel-in-progress: false

jobs:
  rappel:
    name: Ouvrir le rappel de la semaine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # One open reminder at a time: a second one would train the reader to ignore both.
      - name: Rappel, si aucun n'est déjà ouvert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open="$(gh issue list --label recrawl --state open --json number --jq 'length')"
          if [ "$open" != "0" ]; then
            echo "Un rappel est déjà ouvert : rien à faire."
            exit 0
          fi
          version="$(jq -r .meta.corpus_version data/aec-2025.json)"
          asof="$(jq -r .message data/badge.json)"
          {
            echo "Le re-crawl hebdomadaire est dû."
            echo
            echo '```'
            echo 'npm run recrawl              # ingestion, invariants, diff, pull request'
            echo 'npm run recrawl -- --dry-run # ingestion et diff, sans rien écrire'
            echo '```'
            echo
            echo "Corpus commité : \`$version\`, à jour au **$asof**."
            echo
            echo "**Pourquoi en local et pas ici.** melenchon2027.fr est derrière Cloudflare et"
            echo "renvoie 403 aux IP de datacenter : depuis un runner GitHub l'ingestion échoue"
            echo "à la première requête, depuis une connexion résidentielle tout passe en 200"
            echo "(mesuré le 10/9/2026, D14.13). Rien d'autre n'a changé : mêmes portes, même"
            echo "diff, même pull request relue à la main."
            echo
            echo "⚠️ **Constat du 10/9/2026 à revérifier d'abord (D14.14)** : les sous-pages du"
            echo "livre renvoyaient 404, y compris les URL que la page d'accueil publie"
            echo "elle-même. Si c'est toujours le cas, il n'y a rien à crawler — archiver une"
            echo "capture datée et ne rien décider (D12.6)."
          } > /tmp/rappel.md
          gh issue create \
            --title "Re-crawl du corpus — semaine du $(date -u +%Y-%m-%d)" \
            --body-file /tmp/rappel.md \
            --label recrawl
