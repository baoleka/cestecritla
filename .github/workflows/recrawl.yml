# Weekly reminder to check the source of the programme (D1.3, amended by D14.13 and D15.12).
#
# This workflow USED to do the crawl. It cannot: measured 10/9/2026, on the first real execution
# the dossier ever attempted (H-COR-2), melenchon2027.fr answers HTTP 403 to GitHub Actions
# runners. Isolated precisely — from a residential connection every client gets 200 (curl with
# the project UA, with a browser UA, with NO UA at all, and Node's fetch, the exact code path
# ingest.ts uses); from the runner, 403. It is the source IP range, not the User-Agent and not
# the TLS fingerprint. The site sits behind Cloudflare.
#
# So the check is local, and what remains here is the one thing Actions can still do: remind, on
# a date, in a place that is not somebody's memory.
#
# What 12/11/2026 taught (D15.1, D15.12). The programme was re-issued on 5 November — another
# structure, a rewritten text, a licence that no longer allows reproducing it — and this reminder
# said nothing for seven days, for three stacked reasons:
#   1. the label it attaches did not exist in the repository recreated on 10/9, so the step that
#      opens the issue failed every Monday;
#   2. nobody reads a red scheduled job;
#   3. GitHub then disabled the workflow altogether, for repository inactivity.
# Hence: the label is created here if missing (idempotent), and the body no longer reads the
# 2025 corpus, which is an archive now and tells nothing about the state of the source.
name: Rappel de vérification hebdomadaire de la source

on:
  schedule:
    - cron: '0 6 * * 1' # lundi 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: recrawl-reminder
  cancel-in-progress: false

jobs:
  rappel:
    name: Ouvrir le rappel de la semaine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the reminder reads nothing from the tree, so nothing in the tree can break it.
      # One open reminder at a time: a second one would train the reader to ignore both.
      - name: Rappel, si aucun n'est déjà ouvert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A label that does not exist makes `gh issue create --label` fail. --force makes this
          # a no-op when it does exist, so the reminder can never again die of a missing label.
          gh label create recrawl --force --color BFD4F2 \
            --description "Vérification hebdomadaire de la source du programme"

          open="$(gh issue list --label recrawl --state open --json number --jq 'length')"
          if [ "$open" != "0" ]; then
            echo "Un rappel est déjà ouvert : rien à faire."
            exit 0
          fi
          {
            echo "La vérification hebdomadaire de la source est due."
            echo
            echo "La source est \`https://melenchon2027.fr/programme/livre/\` : l'édition 2026"
            echo "du programme, en ligne depuis le 5 novembre 2026 (D15.1). Elle répond 403 aux"
            echo "runners GitHub (D14.13) : la vérification se fait **en local**."
            echo
            echo "- [ ] **La clause de licence** des mentions légales a-t-elle changé ?"
            echo "      Référence : \`docs/discovery/captures/2026-11-12/edition-2026/mentions-legales.txt\`"
            echo "- [ ] **Le sommaire** a-t-il changé ? Référence : 6 parties, 23 chapitres (3-3-4-7-3-3)."
            echo "- [ ] **Le flux** \`/feed/?post_type=lfi_programme_2026\` porte-t-il un \`lastBuildDate\`"
            echo "      plus récent que le dernier relevé ?"
            echo "- [ ] **cestecritla.fr** répond-il toujours ce qu'on croit qu'il répond ?"
            echo
            echo "Tant que le lot B de \`docs/discovery/PLAN-EDITION-2026.md\` n'a pas livré"
            echo "\`scripts/watch-source.ts\` et le re-crawl de l'édition 2026, ces points se relèvent"
            echo "à la main. **Ne pas lancer \`npm run recrawl\`** : il vise l'édition 2025, que la"
            echo "source ne sert plus."
            echo
            echo "Si quelque chose a bougé : archiver une pièce datée sous"
            echo "\`docs/discovery/captures/\` **avant** toute décision (D12.6), et ne jamais y"
            echo "commiter une page du livre — le texte de l'édition 2026 reste sous \`private/\` (D15.6)."
          } > /tmp/rappel.md
          gh issue create \
            --title "Vérification de la source — semaine du $(date -u +%Y-%m-%d)" \
            --body-file /tmp/rappel.md \
            --label recrawl
